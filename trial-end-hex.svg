<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 232" role="img" aria-labelledby="title desc">
  <title id="title">trial-end hex sticker</title>
  <desc id="desc">Pointed hex sticker: a calendar and a rising accrual curve that meets its target, labelled trial-end.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#1C7C96"/>
      <stop offset="55%" stop-color="#14556E"/>
      <stop offset="100%" stop-color="#0C3344"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner">
      <polygon points="100,15 187.47,65.5 187.47,166.5 100,217 12.53,166.5 12.53,65.5"/>
    </clipPath>
  </defs>

  <!-- sticker border -->
  <polygon points="100,6 195.26,61 195.26,171 100,226 4.74,171 4.74,61" fill="#F4EFE6"/>
  <polygon points="100,15 187.47,65.5 187.47,166.5 100,217 12.53,166.5 12.53,65.5" fill="url(#field)"/>

  <g clip-path="url(#inner)">
    <ellipse cx="78" cy="48" rx="70" ry="42" fill="url(#gloss)"/>

    <!-- calendar -->
    <g transform="translate(100 64)">
      <rect x="-13" y="-29" width="3.2" height="8" rx="1.2" fill="#F7F4EE"/>
      <rect x="9.8" y="-29" width="3.2" height="8" rx="1.2" fill="#F7F4EE"/>
      <rect x="-24" y="-23" width="48" height="42" rx="3.5" fill="#F7F4EE"/>
      <path d="M-20.5 -23 H20.5 A3.5 3.5 0 0 1 24 -19.5 V-12 H-24 V-19.5 A3.5 3.5 0 0 1 -20.5 -23 Z" fill="#77D1E5"/>
      <g fill="#14556E" opacity="0.55">
        <rect x="-18" y="-8" width="7" height="5.5" rx="1"/>
        <rect x="-9" y="-8" width="7" height="5.5" rx="1"/>
        <rect x="0" y="-8" width="7" height="5.5" rx="1"/>
        <rect x="9" y="-8" width="7" height="5.5" rx="1"/>
        <rect x="-18" y="-0.5" width="7" height="5.5" rx="1"/>
        <rect x="0" y="-0.5" width="7" height="5.5" rx="1"/>
        <rect x="9" y="-0.5" width="7" height="5.5" rx="1"/>
        <rect x="-18" y="7" width="7" height="5.5" rx="1"/>
        <rect x="-9" y="7" width="7" height="5.5" rx="1"/>
        <rect x="0" y="7" width="7" height="5.5" rx="1"/>
      </g>
      <rect x="-9" y="-0.5" width="7" height="5.5" rx="1" fill="#77D1E5"/>
      <rect x="9" y="7" width="7" height="5.5" rx="1" fill="#F2997A"/>
    </g>

    <!-- accrual projection -->
    <path d="M46 104 V150 H158" fill="none" stroke="#F4EFE6" stroke-width="1.15" stroke-linecap="square" opacity="0.5"/>
    <path d="M52 108 H154" fill="none" stroke="#F2997A" stroke-width="1.35" stroke-dasharray="2.6 2" opacity="0.95"/>
    <path d="M54 144 H70 V136 H86 V128 H102 V120" fill="none" stroke="#F7F3EA" stroke-width="3.3" stroke-linecap="butt" stroke-linejoin="miter"/>
    <path d="M102 120 H118 V114 H134 V108 H150" fill="none" stroke="#77D1E5" stroke-width="3.3" stroke-dasharray="4 2.3" stroke-linecap="butt" stroke-linejoin="miter"/>
    <circle cx="150" cy="108" r="3.3" fill="#F7F4EE" stroke="#F2997A" stroke-width="1.3"/>

    <text x="100" y="184" text-anchor="middle"
          font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="16" font-weight="700" fill="#F7F4EE" letter-spacing="-0.3">trial-end</text>
  </g>
</svg>
